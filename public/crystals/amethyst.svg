<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-label="amethyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#12081f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#e8d4ff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#7b3fb8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#12081f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#c9a0ff"/>
      <stop offset="48%" stop-color="#7b3fb8"/>
      <stop offset="100%" stop-color="#3b1a6e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="320" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="160" cy="190" r="150" fill="url(#glow)"/>
  <g transform="translate(160 210)">
    <polygon points="-40,-30 -10,-130 30,-40 10,20 -30,10" fill="url(#stone)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
        <polygon points="10,-20 55,-110 80,-10 45,40 5,20" fill="url(#stone)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" opacity="0.95"/>
        <polygon points="-70,-10 -35,-90 -5,-5 -25,50 -65,35" fill="url(#stone)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" opacity="0.9"/>
        <polygon points="-10,-130 30,-40 0,-20 -40,-30" fill="url(#sheen)" opacity="0.4"/>
    
  </g>
  <text x="160" y="385" text-anchor="middle" fill="#e8d4ff" font-family="Georgia, serif" font-size="15" opacity="0.75">Amethyst</text>
</svg>