<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-label="carnelian">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#12081f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffd0a0" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#e05020" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#12081f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffb070"/>
      <stop offset="48%" stop-color="#e05020"/>
      <stop offset="100%" stop-color="#8a2008"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="320" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="160" cy="190" r="150" fill="url(#glow)"/>
  <g transform="translate(160 210)">
    <ellipse cx="0" cy="0" rx="88" ry="108" fill="url(#stone)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
        <ellipse cx="-18" cy="-28" rx="40" ry="55" fill="url(#sheen)" opacity="0.45"/>
    
  </g>
  <text x="160" y="385" text-anchor="middle" fill="#ffd0a0" font-family="Georgia, serif" font-size="15" opacity="0.75">Carnelian</text>
</svg>