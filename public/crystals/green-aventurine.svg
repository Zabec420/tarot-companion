<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-label="green-aventurine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#12081f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#e0ffc0" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#3a9a50" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#12081f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#b0e090"/>
      <stop offset="48%" stop-color="#3a9a50"/>
      <stop offset="100%" stop-color="#1a5028"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="320" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="160" cy="190" r="150" fill="url(#glow)"/>
  <g transform="translate(160 210)">
    <ellipse cx="0" cy="0" rx="88" ry="105" fill="url(#stone)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
        <circle cx="-25" cy="-30" r="4" fill="#ffffff" opacity="0.8"/>
        <circle cx="20" cy="-10" r="3" fill="#ffffff" opacity="0.7"/>
        <circle cx="-5" cy="25" r="3.5" fill="#ffffff" opacity="0.65"/>
        <circle cx="35" cy="30" r="2.5" fill="#ffffff" opacity="0.75"/>
        <ellipse cx="-15" cy="-20" rx="30" ry="40" fill="url(#sheen)" opacity="0.35"/>
    
  </g>
  <text x="160" y="385" text-anchor="middle" fill="#e0ffc0" font-family="Georgia, serif" font-size="15" opacity="0.75">Green Aventurine</text>
</svg>