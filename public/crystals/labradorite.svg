<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-label="labradorite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#12081f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#40e0c0" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#2a3440" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#12081f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#6a7a88"/>
      <stop offset="48%" stop-color="#2a3440"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="320" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="160" cy="190" r="150" fill="url(#glow)"/>
  <g transform="translate(160 210)">
    <polygon points="0,-110 70,-50 55,95 -55,95 -70,-50" fill="url(#stone)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
        <polygon points="-15,-20 40,-55 50,10 5,35" fill="#40e0c0" opacity="0.55"/>
        <polygon points="-35,10 10,-15 20,50 -25,60" fill="#80a0ff" opacity="0.35"/>
    <circle cx="25" cy="-30" r="6" fill="#40e0c0" opacity="0.7"/>
  </g>
  <text x="160" y="385" text-anchor="middle" fill="#40e0c0" font-family="Georgia, serif" font-size="15" opacity="0.75">Labradorite</text>
</svg>